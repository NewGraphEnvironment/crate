# Not New Graph Environment's shared workflow (NewGraphEnvironment/flows): it tests the STAC schemas and checks them against the published site.
# Its runner is pinned like the shared ones; move it by hand when they move.
# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  # No `release:` trigger. Only main deploys (see the deploy step), so a release run
  # would build and skip the deploy. Worse, it shares this job's concurrency group, so
  # it replaced the release commit's pending push run and the site stayed one commit
  # behind (#25). The push to main already builds and deploys the release commit.
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The installed contract files -- the schema, the hashing vectors, the register with
      # its compare.json, the mapping -- are frozen per version like the published ones
      # (#58). A check against a copy in the same commit can be edited along with the file,
      # and the latest tag can be cut from an edited commit, so each file is compared with
      # the FIRST release tag that holds it. Every released file stays at its path with its
      # bytes, and nothing is added to a released version directory. A contract file is any
      # file in a version directory, inst/extdata/receipt/<part>/vX.Y.Z/, except its
      # README.md (prose, revised in place), whatever the part is. One exemption, by
      # name: compare.json moved from vectors/v1.0.0/ to register/v1.0.0/ in #58, bytes
      # intact. Runs before R is set up, so it fails fast.
      - name: Check released contract files against the release tags
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin 'refs/tags/v*:refs/tags/v*'
          tags=$(git tag --list 'v*' --sort=v:refname)
          [ -n "$tags" ] || { echo "::error::no release tag to compare the contract files against"; exit 1; }
          pat='^inst/extdata/receipt/[^/]+/v[0-9]+[.][0-9]+[.][0-9]+/[^/]+$'
          moved_from=inst/extdata/receipt/vectors/v1.0.0/compare.json
          moved_to=inst/extdata/receipt/register/v1.0.0/compare.json
          # "<tag> <path>" for every tag, oldest first; then the first tag per path.
          all=""
          for t in $tags; do
            files=$(git ls-tree -r --name-only "$t" -- inst/extdata/receipt)
            hits=$(printf '%s\n' "$files" | grep -E "$pat" | grep -v '/README[.]md$' || true)
            [ -z "$hits" ] || all="$all$(printf '%s\n' "$hits" | sed "s|^|$t |")"$'\n'
          done
          first=$(printf '%s' "$all" | awk 'NF == 2 && !($2 in seen) { seen[$2] = 1; print }')
          [ -n "$first" ] || { echo "::error::no release tag holds a contract file; the pattern no longer matches the layout"; exit 1; }
          released=$(printf '%s\n' "$first" | awk '{ print $2 }')
          bad=0 n=0
          while read -r t f; do
            n=$((n + 1))
            want=$(git rev-parse "$t:$f")
            if [ -e "$f" ]; then
              if [ "$(git hash-object "$f")" = "$want" ]; then
                echo "unchanged since $t: $f"
              else
                echo "::error::$f differs from its release in $t. A released version is never edited; add a version directory"
                bad=1
              fi
            elif [ "$f" = "$moved_from" ] && [ -e "$moved_to" ] && [ "$(git hash-object "$moved_to")" = "$want" ]; then
              echo "moved, bytes unchanged since $t: $f -> $moved_to"
            else
              echo "::error::$f was released in $t and is gone. A released version stays"
              bad=1
            fi
          done <<< "$first"
          dirs=$(printf '%s\n' "$released" | sed 's|/[^/]*$||' | sort -u)
          current=$(git ls-files -- inst/extdata/receipt)
          current=$(printf '%s\n' "$current" | grep -E "$pat" | grep -v '/README[.]md$' || true)
          for f in $current; do
            d=${f%/*}
            if printf '%s\n' "$dirs" | grep -qxF "$d" && ! printf '%s\n' "$released" | grep -qxF "$f"; then
              echo "::error::$f was added to $d, a released version directory. Add a version directory instead"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]
          echo "$n released contract file(s) checked"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # R-CMD-check.yaml runs these too, but this job is what publishes the STAC and
      # receipt schemas and nothing makes it wait for that one, so their tests also run here:
      # a schema that fails them is never deployed. Each
      # test skips without jsonvalidate, so its absence is an error, not a skip.
      - name: Test the published schemas
        run: |
          stopifnot(requireNamespace("jsonvalidate", quietly = TRUE))
          for (f in c("tests/testthat/test-stac_schemas.R", "tests/testthat/test-crt_receipt_schema.R")) {
            testthat::test_file(f, stop_on_failure = TRUE,
                                reporter = testthat::ProgressReporter$new(show_praise = FALSE))
          }
        shell: Rscript {0}

      # pkgdown renders every root-level .md except a hardcoded allowlist
      # (README, LICENSE, NEWS and two templates). CLAUDE.md is not on it and
      # there is no config option to exclude a file, so the site would publish
      # our internal working notes -- including, on a private repo, the
      # conventions the visibility system marks internal-only.
      #
      # Repo visibility does not help: GitHub Pages serves publicly regardless,
      # and there is no private mode below Enterprise Cloud.
      #
      # This removes it from the CI checkout only, never from the repo, and it
      # has to happen BEFORE the build. Deleting afterwards would still leave
      # the verbatim CLAUDE.md copy pkgdown makes and the entry it writes into
      # the full-text search.json index.
      - name: Keep internal notes out of the published site
        run: rm -f CLAUDE.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # The STAC field schemas in pkgdown/assets/stac/ are fetched by every catalogue
      # build that validates, and published items name their URLs. The receipt schema in
      # pkgdown/assets/receipt/ is what every receipt's `receipt_version` refers to, and
      # what other implementations validate against (#43). The register and the mapping
      # beside it are what every comparison and every migrated receipt is computed from,
      # each under its own version (#58). So each one must
      # reach the site as committed, and a version already on gh-pages must be
      # rebuilt byte for byte: an edit changes what published items mean, and a
      # deletion (clean: true below) breaks every build that validates them.
      #
      # Compared against the gh-pages branch rather than the live URL: a 404 from
      # Pages would read as "new version" whether or not the site was up. A failed
      # fetch fails the step.
      - name: Check the published schemas against what is on gh-pages
        run: |
          set -euo pipefail
          ref="${SCHEMAS_PUBLISHED_REF:-FETCH_HEAD}"
          [ "$ref" != FETCH_HEAD ] || git fetch -q --depth=1 origin gh-pages
          bad=0 n=0
          for src in pkgdown/assets/stac/*/v*/schema.json pkgdown/assets/receipt/v*/schema.json \
                     pkgdown/assets/receipt/register/v*/register.csv pkgdown/assets/receipt/mapping/v*/mapping.csv; do
            [ -e "$src" ] || continue
            n=$((n + 1))
            rel="${src#pkgdown/assets/}"
            cmp -s "$src" "docs/$rel" || { echo "::error::$rel did not reach the site as committed"; bad=1; }
          done
          [ -n "$(ls pkgdown/assets/stac/*/v*/schema.json 2>/dev/null)" ] || { echo "::error::no STAC schemas under pkgdown/assets/stac/"; bad=1; }
          [ -n "$(ls pkgdown/assets/receipt/v*/schema.json 2>/dev/null)" ] || { echo "::error::no receipt schema under pkgdown/assets/receipt/"; bad=1; }
          [ -n "$(ls pkgdown/assets/receipt/register/v*/register.csv 2>/dev/null)" ] || { echo "::error::no register under pkgdown/assets/receipt/register/"; bad=1; }
          [ -n "$(ls pkgdown/assets/receipt/mapping/v*/mapping.csv 2>/dev/null)" ] || { echo "::error::no mapping under pkgdown/assets/receipt/mapping/"; bad=1; }
          # Assigned on their own lines so a bad ref stops the step under set -e; inside
          # the loop header its failure would read as "nothing published".
          git rev-parse -q --verify "$ref^{commit}" >/dev/null
          published=$(git ls-tree -r --name-only "$ref" -- stac receipt)
          published=$(printf '%s\n' "$published" \
            | grep -E '^((stac/[^/]+|receipt)/v[^/]+/schema\.json|receipt/register/v[^/]+/register\.csv|receipt/mapping/v[^/]+/mapping\.csv)$' || true)
          for rel in $published; do
            if [ ! -e "docs/$rel" ]; then
              echo "::error::$rel is published but no longer built. A released version stays; restore pkgdown/assets/$rel"
              bad=1
            elif ! git show "$ref:$rel" | cmp -s - "docs/$rel"; then
              echo "::error::$rel differs from the published version. A released version is never edited; add a new version directory"
              bad=1
            else
              echo "unchanged: $rel"
            fi
          done
          [ "$bad" -eq 0 ]
          echo "$n contract file(s) built"


      # A skip here would be invisible, so assert rather than assume. Any
      # top-level page beyond the ones pkgdown is expected to produce means a
      # root markdown file reached the site -- the exact shape of the leak this
      # workflow exists to prevent, and the shape a future INTERNAL.md would
      # take.
      - name: Fail if an unexpected page reached the site
        run: |
          allowed="404 authors index LICENSE LICENSE-text"
          unexpected=""
          for f in docs/*.html docs/*.md; do
            [ -e "$f" ] || continue
            b=$(basename "$f"); b="${b%.*}"
            case " $allowed " in *" $b "*) ;; *) unexpected="$unexpected $(basename "$f")";; esac
          done
          if [ -n "$unexpected" ]; then
            echo "Unexpected top-level page(s) in docs/:$unexpected"
            echo "pkgdown renders every root .md; remove internal ones before the build."
            exit 1
          fi
          echo "no unexpected top-level pages"

      - name: Deploy to GitHub pages 🚀
        # Only main deploys. A schema version that reaches gh-pages is frozen by the
        # check above, so no other ref may publish, including a dispatched run on a
        # feature branch.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # clean: true so the deployed site equals what the build produced.
          # With clean: false the action never deletes, so removing a file from
          # the repo does not unpublish it -- measured on gq, where
          # task_plan.html and friends were still returning 200 long after the
          # PWF documents left the root. Checked before flipping: no CNAME (the
          # domain comes from the org site repo), no dev/ versioned docs, and
          # the favicon/webmanifest assets are build output rather than
          # hand-added.
          clean: true
          branch: gh-pages
          folder: docs
