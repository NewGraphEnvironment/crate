file: discharge/fwa/v1/segment_monthly
description: >
  Mean monthly and annual stream discharge per BC Freshwater Atlas (FWA) stream
  segment, published by wet (NewGraphEnvironment/wet#7) as Hive-partitioned
  parquet at s3://fresh-bc/discharge/fwa/v1/segment_monthly/. The file_name is
  the dataset ID, <variable>/<network>/<version>/<unit>_<timebase>, from which
  the S3 prefix and the Postgres table (discharge.fwa_v1_segment_monthly) also
  derive.

  One row per segment, month and source with a value. The path carries three
  Hive keys that are not columns in the files: `scenario` (historical, ssp245,
  ssp585), `forcing` (the climate data that drove the estimate: PNWNAmet, a
  GCM as PCIC spells it, climr, ensemble) and `source` (<group>_<method>:
  pcic_routed, wet_balance). A reader that enables Hive partitioning gets them
  back as columns.

  Each part file holds one FWA top-level drainage (the first field of
  fwa_watershed_code), sorted by watershed_group_code so a one-group read
  prunes on row-group statistics.

canonical:
  shape: long
  cols:
    - name: linear_feature_id
      type: integer
      required: true
      notes: FWA stream segment (key, with month and the Hive keys).
    - name: watershed_group_code
      type: string
      required: true
      notes: The segment's FWA watershed group, four letters (e.g. BULK).
    - name: month
      type: integer
      required: true
      notes: Calendar month 1-12, or 0 for the annual value (key).
    - name: runoff_mm
      type: double
      required: true
      notes: >
        Runoff depth over the segment's upstream area in the month (or year),
        mm. NA for a routed row off its watershed's own line, where the only
        area available is another line's.
    - name: q_m3s
      type: double
      required: true
      notes: Mean discharge in the month (or year), m3/s.
    - name: coverage
      type: double
      required: true
      notes: >
        Share of the upstream area the balance's inputs cover, 0-1. NA for
        routed rows, which have no such share.
    - name: period
      type: string
      required: true
      notes: >
        Years the mean is over, "YYYY-YYYY" (1981-2010 for both sources in
        the historical scenario). A projection partition holds
        several periods.
    - name: pick
      type: logical
      required: true
      notes: >
        TRUE on the default source for this segment, the same source in all 13
        months; exactly one row per segment, month and scenario is TRUE. The
        rule is wet's wet_source_pick() (NewGraphEnvironment/wet#57). It is
        computed across every source of a scenario, so a new source means
        rewriting every source's files.

decisions:
  - decisions/nge/20261012_dataset_id_keys.md
