upstream_variants:
  - id: rfp-build-2026-08
    description: The form as rfp builds it (124 columns; the GeoPackage at rfp@a901caa,
      last changed 2026-08). Every 2026 capture of this form measured in the four
      fish passage projects on 2026-10-30 carried this column set, except the variant
      below.
    fingerprint: 124-54160527d93360ae
    normalize_fn: reader-supplied
    first_seen: 2026-08
  - id: capture-utm-columns-2025
    description: 'A field capture first seen in 2025 and still deployed in one of
      the four fish passage projects in 2026 (122 columns, measured 2026-10-30). It
      is not a subset of the rfp build: it lacks `surveyor_1`, `surveyor_2`, `surveyor_3`,
      `habitat_comment`, `utm_corrected` and `assessment_comments_og`, and carries
      `rowid`, `utm_zone`, `easting` and `northing`, which the build does not. Two
      vintages of this form therefore rename rather than nest: a null in either set
      of columns means the form did not have it.'
    fingerprint: 122-795b55de0708d6bf
    normalize_fn: reader-supplied
    first_seen: '2025'
decisions:
  - decisions/nge/20261030_form_schemas_fish_passage.md
