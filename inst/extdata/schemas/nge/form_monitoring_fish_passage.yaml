file: form_monitoring_fish_passage
description: |-
  What each column of the `form_monitoring_fish_passage` field form means. One row per record: the `nge/form_capture` envelope, the record's position, then the form's own 35 columns as rfp builds it.

  Derived by `data-raw/forms_derive-schemas.R` from the field definitions rfp builds the form from, so the meaning is taken from where it is written rather than restated. How the form shows a column is rfp's, not this schema's.

  Every form column is optional, so a record from an earlier vintage that lacks one still conforms. A null then means one of two things, and `schema_version` says which: the observer left it blank, or the form did not have that column yet. `crt_schema_variant()` names the version a record's `schema_version` belongs to. Whether a record can answer a given question is a grade (`crt_schema_grade()`), not a property of the schema.

  Allowed values (`values`) and ranges are what a QC rule flags against; `crt_schema_conform()` does not refuse a value outside them.
canonical:
  shape: long
  cols:
    - name: project
      type: string
      required: true
      notes: |
        The dataset the record came from (key). For a synced field project this is the project identifier; for a file-based import it names the source collection. Source-neutral on purpose, matching track_sessions.
    - name: form
      type: string
      required: true
      notes: |
        Which form captured the record (key), e.g. `form_vri_qa`. Carried as a column rather than left implicit in a table name, so records from several forms can be stacked and a consumer can still tell them apart.
    - name: record_id
      type: integer
      required: true
      notes: |
        Identifier unique within `(project, form)` (key). Carried from the capture source rather than reassigned, so anything keyed on it survives a re-harvest.
        Unique within one file lineage, not globally. A GeoPackage `fid` is `INTEGER PRIMARY KEY AUTOINCREMENT`, so SQLite never reissues a deleted id - but rewriting the layer with another tool restarts the sequence at 1 and silently repoints anything that keyed on it. Pair it with `captured_at` as a fingerprint wherever that matters, the same guard track_annotations uses.
    - name: source_version
      type: string
      required: true
      notes: |
        The upstream version the record was captured at, e.g. `v112`.
        Deliberately a column and not a consumer-side manifest field, which is the opposite of the usual rule and is worth stating plainly. That rule exists because stamping the upstream's *current* version onto every row rewrites a snapshot's bytes every time the project versions for reasons that have nothing to do with the data. This is not that: the version a record was captured at is fixed at capture and never moves again.
        It is also load-bearing for identity. A rebuild of the capture layer restarts `record_id` at 1, so a table holding two vintages holds two rows with the same `record_id`. `(project, form, source_version, record_id)` is what stays unique across them - and a consumer that orders on a non-unique key gets a row order the source does not guarantee, which is a reproducibility failure with nothing visible behind it.
        NA where there is no versioned upstream.
    - name: schema_version
      type: string
      required: true
      notes: |
        Fingerprint of the column set this record was captured with. Derived from the capture's own columns rather than assigned by hand, so two vintages differ here if and only if their column sets differ and nobody has to remember to bump anything.
        It identifies a shape, not an ordering or a release. Two captures with the same columns in a different order are the same vintage.
        **How it is computed**, stated here rather than left to each producer, because two producers computing it differently would give two genuinely different vintages the same version by accident:
        `<n>-<digest>`, where `n` is the count of capture columns and `digest` is the XXH64 (seed 0, 16 hex digits) of `name:TYPE` pairs - the type as the file declares it, upper-cased - sorted by name in C collation and joined with commas, over the capture's own columns only - excluding geometry, and excluding any surrogate row id the reader supplies rather than the capture carrying. `crt_schema_fingerprint()` computes it; call it rather than reimplementing it.
        Types are in the pair because a set of names alone is blind to a column changing type between vintages, which is a real schema change that would otherwise report as no change and then either error or silently coerce when the two are stacked.
        Hash the joined string's own bytes, never an in-memory object: a hash of a serialized object carries the language's serialization format, so a serialization change would move this column - and therefore the bytes of any snapshot carrying it - with no schema change behind it. Values written before this definition moved into crate (#13) hashed R's serialization of the string, so they differ from this definition for the same columns; a re-harvest replaces them.
    - name: captured_at
      type: datetime
      required: true
      notes: |
        When the observation was made, in UTC, taken from the form's own time field - which is named differently by different forms, so the reader supplies it.
        Stamped, never converted. GeoPackage stores these as ISO 8601 with an explicit trailing Z, and readers that return the column with an empty timezone attribute make it render in the machine's local zone. On a UTC-7 machine a record stored at 21:04:28Z displays as 14:04:28, and writing what is displayed loses seven hours with nothing reported.
    - name: x
      type: double
      required: true
      notes: Easting of the record's point, in `source_epsg`. NA for a record with
        no fix.
    - name: 'y'
      type: double
      required: true
      notes: Northing of the record's point, in `source_epsg`. NA for a record with
