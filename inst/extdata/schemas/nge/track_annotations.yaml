file: track_annotations
description: >
  Overrides for what a crew said about a tracking session. Deliberately a
  separate table from track_sessions, and deliberately shaped like part of it.

  Naming can come from capture now: an rfp-deployed tracking layer carries
  `track_name`, `track_type` and `track_description`, typed by the person who
  walked the track at the moment they stopped recording. Those values are
  captured, so they are immutable and re-harvest safe, and for anything a crew
  can say at walk time they are better than a name reconstructed off a map
  weeks later. This table exists for what capture cannot do: correct a value
  typed wrong in the field, and name a session from a source that has no naming
  fields at all - a layer the tracking plugin created on its own, or a GPX
  import, where every one of those columns is NA.

  The rule, stated once: a column here that is not part of the join - not
  `project`, `session_id` or the `time_start_m` fingerprint, each labelled as
  such below - and that shares its name with a column of track_sessions is an
  override of it. At read time the override wins where it
  is non-NA and the captured value stands otherwise -
  coalesce(annotation, captured). Nothing here is a second field with the same
  name; it is the same field, corrected. A reader that assigns the annotation
  column over the captured one without the coalesce blanks every session nobody
  annotated, which is the failure this paragraph is written to prevent.

  Two consequences of NA meaning "no override", stated so no reader has to
  guess. An empty string is not an override either: a text widget that was
  opened and cleared writes `""`, and a reader normalises that to NA before
  coalescing. And there is therefore no way to override a captured value *to*
  blank - a wrongly typed name can be replaced, not erased. Nothing needs that
  today; if something does, it is a new column with its own semantics, not a
  reinterpretation of NA.

  Why still a separate table: captured tables are immutable and capture-shaped;
  annotations are ours and live beside them. A harvest only ever writes the
  captured tables, so nothing it writes can reach an edit, and re-harvest safety
  is a property of the layout rather than of somebody remembering.

  There is no upstream variant for this table because there is no upstream. It
  is born canonical, which is why it is registered `schema_only`.

canonical:
  shape: long
  cols:
    - name: project
      type: string
      required: true
      notes: The dataset the annotated session belongs to (key).
    - name: session_id
      type: integer
      required: true
      notes: >
        Session identifier, unique within `project` (key). Together with
        `project` this is the join to track_sessions.
    - name: time_start_m
      type: datetime
      required: true
      notes: >
        Fingerprint, not data. Copied from the session's time_start_m when the
        annotation was written, and checked against it at join time.

        session_id is stable while the source layer's identity sequence is -
        for a GeoPackage that means AUTOINCREMENT, which never reissues a
        deleted id. It is not stable across a *rebuild* of that layer, which
        restarts the sequence and would silently repoint every annotation onto
        a different session. Comparing this column at join time turns that
        from silent mis-attribution into a loud failure, and costs no column
        that did not already exist.
    - name: track_name
      type: string
      required: true
      notes: >
        Override of track_sessions.track_name. NA means no override - the
        captured name stands.

        Required as a column, though its values may all be NA: this table is
        ours, so its shape is fixed rather than a floor, and a writer that
        drops a column has changed the contract, not omitted an optional.
    - name: track_type
      type: string
      required: true
      notes: >
        Override of track_sessions.track_type. Same open string, same
        convention for its values - see that column.
    - name: track_description
      type: string
      required: true
      notes: >
        Override of track_sessions.track_description. This absorbs what an
        earlier `notes` column carried - why a session ended, whether it was a
        route or a bushwhack - which the capture now records under
        track_type and track_description, so a second free-text field with a
        different name would be the same thing twice.

forward_compat:
  - cols:
      - annotated_by
      - annotated_at
    note: >
      Provenance for a hand-edited table is real - who claimed a name, and
      when - and was considered when this schema was written. Deferred rather
      than omitted: nothing reads it yet, and a column added before it has a
      consumer is a guess about what that consumer will want. Add both when
      something needs to attribute an edit.

      This is also why track_sessions.named_by has no override here. Who
      named a session at capture and who corrected it afterwards are two
      different claims; the second one is `annotated_by`.
  - cols:
      - review_status
    note: >
      Anticipated the moment more than one person annotates. Same reasoning -
      declare it when there is a workflow to attach it to.

decisions:
  - decisions/nge/20260824_track_canonical_two_tables.md
