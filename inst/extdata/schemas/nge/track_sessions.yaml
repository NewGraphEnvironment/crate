file: track_sessions
description: >
  One row per GPS tracking session. The companion table is track_vertices, which
  holds the positions; this one holds what is true of the session as a whole,
  including the evidence that its two clocks agree.

  Canonical shape is deliberately not tied to any one capture tool. `project`
  and `session_id` are defined below in source-neutral terms so that a track
  recorded years earlier as a GPX file is the same canonical thing as one
  captured by a mobile plugin today, and fits this schema without a rename.

  Four columns - `track_name`, `track_type`, `track_description`, `named_by` -
  are what the crew said about the session at the moment they walked it. They
  are captured, so they are immutable and re-harvest safe like everything else
  here. A capture source that has no such fields yields `NA` in them. A later
  correction does not edit them: it lives in track_annotations, whose columns of
  the same name override these at read time. See that schema for the rule.

canonical:
  shape: long
  cols:
    - name: project
      type: string
      required: true
      notes: >
        The dataset the track came from (key). For a synced field project this
        is the project identifier; for a file-based import it names the source
        collection. Paired with session_id it is the session's identity.
    - name: session_id
      type: integer
      required: true
      notes: >
        Identifier unique within `project` (key). Carried from the capture
        source rather than reassigned, so annotations keyed on it survive a
        re-harvest. It is unique within one file lineage, not globally, and not
        guaranteed across a rebuild of the source layer - see track_annotations
        for the fingerprint that makes a reassignment detectable.
    - name: tracked_by
      type: string
      required: true
      notes: Account or person the capture source attributes the session to.
    - name: time_start
      type: datetime
      required: true
      notes: >
        Session start as reported by the capture source's own attribute, in
        UTC. Compare against time_start_m rather than trusting either alone.
    - name: time_end
      type: datetime
      required: true
      notes: Session end as reported by the capture source's attribute, in UTC.
    - name: time_start_m
      type: datetime
      required: true
      notes: >
        Session start derived from the first vertex's own timestamp, in UTC.
        This is the authoritative clock: it is the same value every vertex is
        stamped with, so it is what a join to any other observation resolves
        against.
    - name: time_end_m
      type: datetime
      required: true
      notes: Session end derived from the last vertex's timestamp, in UTC.
    - name: clock_delta_start_s
      type: double
      required: true
      notes: >
        time_start_m minus time_start, in seconds. Not a passthrough - a
        semantic claim that the attribute clock and the vertex clock agree.
        Expected to be within a few seconds of zero. A whole-hour value is the
        signature of a capture source that has begun writing local time, which
        is the failure this column exists to make visible rather than silent.
    - name: clock_delta_end_s
      type: double
      required: true
      notes: time_end_m minus time_end, in seconds. Same reading as above.
    - name: total_distance
      type: double
      required: true
      notes: >
        Session length in metres as reported by the capture source. Reported,
        not recomputed - it is kept as captured so a disagreement with a
        recomputation from the vertices is discoverable. NA for a source that
        does not report one.
    - name: n_vertices
      type: integer
      required: true
      notes: Count of rows this session has in track_vertices.
    - name: track_name
      type: string
      required: false
      notes: >
        What the session was, typed by the person who walked it, at the time
        they walked it. Written once at capture and never edited here; a
        correction is an annotation. NA where the capture source has no such
        field, which is any layer the tracking plugin created on its own and
        any GPX import.

        Not required, because a source without it is still a complete session.
        A source that *has* the field and carries no value is a session nobody
        named, which is different, and reads as NA all the same.
    - name: track_type
      type: string
      required: false
      notes: >
        What kind of session it was. An open string here: the allowed values
        are a convention of the capture tool, not a canonical enumeration, and
        the current list lives in rfp's shipped lookup rather than in this
        schema so that a field-app change is not a crate release. At the time
        of writing that list is `day log`, `stream survey`, `bushwhack`,
        `access route`, `drive`, `other`, with `day log` the default - the
        normal case is a track that runs all day, so anything recorded
        separately is found by its time.

        Declared as a string with no enum rather than left undeclared, so the
        column is typed and carried. If the list ever needs enforcing, that is
        the `enum` slot crt_schema_validate() reserves.
    - name: track_description
      type: string
      required: false
      notes: >
        Free text for what a name cannot carry - why the session ended, what
        was found, conditions. Same capture rules as track_name.
    - name: named_by
      type: string
      required: false
      notes: >
        Who named the session, where that differs from `tracked_by`, who walked
        it. The capture tool defaults this to the same account variable it
        stamps `tracked_by` with, so the two agree unless someone changed one -
        a second identity that is only informative when it disagrees with the
        first.

        Deliberately not mirrored in track_annotations: who wrote an
        *override* is `annotated_by`, which that schema reserves.

upstream_variants:
  - id: mergin-tracking-plugin-2026-08
    description: >
      GeoPackage layer `tracking_layer` written by the Mergin Maps position
      tracking plugin, as the plugin creates it. One LineStringZM feature per
      session in EPSG:4326, where per vertex there is X, Y, Z and M and nothing
      else - no accuracy, speed, bearing or satellite count. Z is ellipsoidal
      altitude; M is the UTC timestamp in epoch seconds.

      Both clocks are UTC. `tracking_start_time` is stored as ISO 8601 with an
      explicit trailing Z and agrees with the vertex M to within a second.
      Readers that return the DATETIME column with an empty timezone attribute
      make it render in the session's local zone, which reads as a second clock
      and is not one - hence the datetime type stamps rather than converts, and
      hence the clock_delta columns above.

      This shape has none of the four crew-supplied columns. They are optional
      in the canonical shape, so the frame conforms without them, and a reader
      producing the canonical table yields NA for them. A layer carrying *some*
      of them but not all is neither this variant nor
      the rfp one - it is drift, and a reader should abort on it rather than
      conform it. crate cannot tell the two apart from the frame alone, which is
      why that check is the reader's.
    cols:
      - fid
      - geom
      - tracking_start_time
      - tracking_end_time
      - total_distance
      - tracked_by
    normalize_fn: reader-supplied
    first_seen: 2026-08

  - id: mergin-tracking-rfp-2026-08
    description: >
      The plugin's layer above, with four columns appended by
      `rfp::rfp_tracking_fields_add()` and given widgets in the project by
      `rfp::rfp_qgs_tracking_fields_add()`, so a crew can name a session in
      the field app at the moment they stop recording. All four are TEXT.
      `track_type` is a value map whose stored value equals its label;
      `named_by` defaults to the capturing account via `@mergin_username`.

      The shipped lookup `inst/lookups/rfp_tracking_fields.csv` in rfp is the
      authority for the field set, widgets, options and defaults - not rfp's
      roxygen, which has lagged it. rfp carries a measured argument that
      augmenting the plugin's schema is safe (the plugin's own reconcile path is
      unreachable for an rfp-deployed project and it never enumerates or prunes
      columns), asserted by test against the installed plugin's source rather
      than against prose. That argument covers the desktop plugin only; the
      mobile app is a separate codebase.

      Measured on a real project's layer, 2026-09: four sessions, three
      carrying a crew-supplied name, all four a `track_type` and a `named_by`.
    cols:
      - fid
      - geom
      - tracking_start_time
      - tracking_end_time
      - total_distance
      - tracked_by
      - track_name
      - track_type
      - track_description
      - named_by
    normalize_fn: reader-supplied
    first_seen: 2026-08

forward_compat:
  - cols:
      - horizontal_accuracy
      - speed
    note: >
      A capture source reporting per-fix accuracy or speed would carry them on
      the vertices, not here. Nothing writes them today; declare them in
      track_vertices when one does.

